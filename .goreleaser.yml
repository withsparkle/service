version: 2

project_name: sparkle

archives:
  - id: sparkle
    ids:
      - sparkle
    files:
      - LICENSE
      - PATENTS
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula (as octopot/indexit and octomation/maintainer). Keep GoReleaser
# pinned in CI.
brews:
  - name: sparkle
    ids: [sparkle]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: "✨ Sparkle service. The personal development framework and Personal Knowledge Management platform."
    directory: Formula
    homepage: https://sparkle.wiki/
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "sparkle"
      generate_completions_from_executable(bin/"sparkle", "completion")
      prefix.install_metafiles
    test: |
      system "#{bin}/sparkle", "version"

builds:
  - id: sparkle
    binary: sparkle
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

checksum: { name_template: checksums.txt }

dockers_v2:
  - id: sparkle
    ids: [sparkle]
    images: ['ghcr.io/withsparkle/service']
    tags:
      - '{{.Tag}}'
      - 'v{{.Major}}'
      - 'v{{.Major}}.{{.Minor}}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    extra_files: [LICENSE]
    labels:
      org.opencontainers.image.revision: '{{.FullCommit}}'
      org.opencontainers.image.created: '{{.Date}}'
      org.opencontainers.image.version: '{{.Version}}'
    platforms: [linux/amd64, linux/arm64]

release:
  # the repository comes from the git remote; a prerelease tag (vX.Y.Z-rcN)
  # is published as a prerelease, never as Latest
  prerelease: auto
